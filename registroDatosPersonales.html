    </head>
    <body>

        <header class="barra-superior navbar navbar-expand-lg">

            <a class="navbar-brand">
                <img
                src="imagenes/logo.png"
                alt="logo"
                width="60"
                height="60">

            </div>

        </header>
        
        <main class="d-flex justify-content-center align-items-center">

        <section class="rectangulo-formulario">

            <h1 class="text-center mb-4 texto-negro">
                Crear Cuenta
            </h1>

            <form action="php/registroUsuario.php" method="POST">
                

                <div class="mb-4">
                    <label for="nom-ap" class="form-label texto-negro">
                        Ingrese Nombre y Apellido:
                    </label>
                    
                    <input
                    type="text"
                    class="form-control"
                    id="nombreApellido"
                    name="nombreApellido"
                    required
                    > 
                    <label for="telefono" class="form-label texto-negro">
                        Ingrese Telefono:
                    </label>
                    
                    <input
                        type="tel"
                        class="form-control"
                        id="telefono"
                        name="telefono"
                        required
                    >  
                    
                    <label for="contraseña" class="form-label texto-negro">
                        Ingrese Contraseña:
                    </label>
                    <div class="barra-contra">
                        <input
                        type="password"
                        class="form-control"
                        id="contrasena"
                        name="contrasena"
                        required
                        >
                        <button
                                type="button"
                                class="boton-ojo"
                                onclick="mostrarContrasena()"
                                id="boton-ojo"
                        >
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-end gap-3">
                <!--lo de arriba coloca dos sectores en una misma fila.-->

                    <div>
                        <p class="texto-registro mb-1 texto-negro">
                            Desea volver?
                        </p>

                        <a href="registro.html" class="btn btn-outline-primary">
                            Atrás
                        </a>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Continuar
                    </button>

                </div>

            </form>

        </section>
        <a href="home.php" class="boton-atras">
            ← Inicio
        </a>

    </main>
    <script>
        function mostrarContrasena() {

            const input = document.getElementById("contrasena");
            const icono = document.querySelector("#boton-ojo i");

            if (input.type === "password") {

                input.type = "text";
                icono.className = "bi bi-eye-slash";

            } else {

                input.type = "password";
                icono.className = "bi bi-eye";

            }
        }


    </script>
    </body>
