<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- <title>AeroFly</title> -->
    <link rel="icon" href="../imagenes/logo.png" type="image/png">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">


    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }


        body{

            font-family:Arial, Helvetica, sans-serif;

        }


        /* HERO */

        .hero{

            height:100vh;

            background-image:url("/imagenes/avion2.jpg");

            background-size:140%;

            background-position:70% bottom;

            position:relative;

        }


        /* CAPA BLANCA TRANSPARENTE */

        .hero::before{

            content:"";

            position:absolute;

            inset:0;

            background:linear-gradient(
                90deg,
                rgba(255,255,255,.85),
                rgba(255,255,255,.15)
            );

        }



        /* NAVBAR */

        .navbar{

            position:absolute;

            width:100%;

            z-index:10;

            padding:25px 60px;

        }


        .navbar-brand img{

            object-fit:contain;

        }


        .nav-link{

            color:#222;

            font-weight:600;

            margin-left:25px;

        }


        .btn-menu{

            background:#684028;

            color:white;

            border:none;

            border-radius:25px;

            padding:12px 30px;

            font-weight:bold;

        }


        .btn-menu:hover{

            background:#72472c;

        }



        /* TEXTO */

        .contenido{

            position:absolute;

            top:20%;

            left:60px;

            z-index:2;

        }


        .contenido h1{

            font-size:60px;

            font-weight:900;

            color:#222;

            line-height:1;

        }


        .contenido span{

            font-weight:300;

        }



        /* BUSCADOR */

        .buscador{

            position:absolute;

            z-index:3;

            bottom:20%;

            left:60px;

            width:75%;

            background:white;

            box-shadow:0 10px 30px rgba(0,0,0,.15);
            overflow:hidden;

        }





        /* TIPO DE VIAJE */

        .tipo-viaje{

            padding:15px;

            border-bottom:1px solid #ddd;

        }


        .tipo-viaje label{

            margin-right:25px;

            font-weight:bold;

        }



        /* INPUTS */

        .form-control{
            border:none;
            border-right:1px solid #ddd;
            height:70px;
            min-width:140px;
        }


        .form-control:focus{

            box-shadow:none;

        }



        /* BOTON BUSCAR */

        .buscar{

            height:70px;

            width:100%;

            background:#684028;

            color:white;

            border:none;

            font-size:25px;

        }


        .buscar:hover{

            background:#72472c;

        }



        /* RESPONSIVE */

        @media(max-width:900px){


            .contenido h1{

                font-size:45px;

            }


            .buscador{

                width:85%;

            }

        }


    </style>

</head>


<body>


<section class="hero">


    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg">


        <a class="navbar-brand">

            <img 
            src="../imagenes/logo.png" 
            alt="logo"
            width="60"
            height="60">

        </a>



        <!-- Botón hamburguesa (solo celular) -->

        <button class="navbar-toggler d-lg-none btn-menu">

            ☰

        </button>



        <!-- Menú PC -->

        <div class="ms-auto d-none d-lg-flex align-items-center">


            <a class="nav-link">

                Novedades

            </a>


            <a class="nav-link">

                Destinos

            </a>


            <a class="nav-link">

                Ofertas

            </a>



            <button class="btn-menu ms-4">

                Ingresar

            </button>


        </div>


    </nav>



    <!-- BUSCADOR -->


    <div class="buscador rounded">


        <div class="tipo-viaje">


            <input 
            type="radio"
            name="viaje"
            checked
            onclick="mostrarVuelta()">



            <label>

                Ida y vuelta

            </label>





            <input 
            type="radio"
            name="viaje"
            onclick="ocultarVuelta()">



            <label>

                Solo ida

            </label>



        </div>





        <div class="row g-0">



            <div class="col-md-3">


                <input 
                class="form-control"
                placeholder="Desde">


            </div>





            <div class="col-md-3">


                <input 
                class="form-control"
                placeholder="Hacia">


            </div>





            <div class="col-md-2" id="fecha-ida">


                <input 
                type="date"
                class="form-control">


            </div>






            <div class="col-md-2"
            id="fecha-vuelta">


                <input 
                type="date"
                class="form-control">


            </div>







            <div class="col-md-2">


                <button class="buscar">


                    →

                </button>


            </div>




        </div>



    </div>

    <!-- TITULO -->


    <div class="contenido">


        <h1>

            DONDE<br>

            QUIERAS<br>

            <span>

                VIAJAR

            </span>


        </h1>


    </div>







    







</section>








<script>


    function ocultarVuelta(){

    document.getElementById("fecha-vuelta").style.display="none";

    document.getElementById("fecha-ida").className="col-md-4";

}



function mostrarVuelta(){

    document.getElementById("fecha-vuelta").style.display="block";

    document.getElementById("fecha-ida").className="col-md-2";

}


</script>






<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>



</body>

</html>
