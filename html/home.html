<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- <title>AeroFly</title> -->
    <link rel="icon" href="imagenes/logo.png" type="image/png">

    <!-- Bootstrap -->
    <link rel="stylesheet" href="../css/bootstrap.min.css">

    <link rel="stylesheet" href="../css/estiloshome.css">

</head>


<body>


<section class="hero">


    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg">


        <a class="navbar-brand" href="home.html">

            <img 
            src="../imagenes/logo.png" 
            alt="logo"
            width="60"
            height="60">

        </a>



        <!-- Botón hamburguesa (solo celular) -->

        <button class="navbar-toggler d-lg-none btn-menu">

            ☰

        </button>



        <!-- Menú PC -->

        <div class="ms-auto d-none d-lg-flex align-items-center">


            <a class="nav-link">

                Novedades

            </a>


            <a class="nav-link">

                Destinos

            </a>


            <a class="nav-link">

                Ofertas

            </a>


            <a href="iniciosesion.html" class="btn-menu ms-4">
                Ingresar
            </a>


        </div>


    </nav>



    <!-- BUSCADOR -->



    <div class="contenedor-buscador">
        <div class="tipo-viaje">


            <input 
            type="radio"
            name="viaje"
            checked
            onclick="mostrarVuelta()">


            
            <label>

                Ida y vuelta

            </label> 





            <input 
            type="radio"
            name="viaje"
            onclick="ocultarVuelta()">



            <label>

                Solo ida

            </label>



        </div>
        <div id ="buscador-ing-datos">
            <div class="row g-0">

                <div class="col-md-3">


                    <input 
                    class="form-control"
                    placeholder="Desde">


                </div>

                <div class="col-md-3">


                    <input 
                    class="form-control"
                    placeholder="Hacia">


                </div>


                <div class="col-md-2" id="fecha-ida">


                    <input 
                    type="date"
                    class="form-control">


                </div>






                <div class="col-md-2"
                id="fecha-vuelta">


                    <input 
                    type="date"
                    class="form-control">


                </div>







                <div class="col-md-2">


                    <button class="buscar">


                        →

                    </button>


                </div>


            </div>

        </div>
        <br>

    </div>
    <!-- TITULO -->

    <div class="contenido">


        <h2>
            <span>
                ENCONTRÁ EL <br>
            </span>

            VUELO IDEAL<br>
            <span>

                PARA TU PROXIMO VIAJE
            </span>
            


        </h2>


    </div>


</section>








<script>


    function ocultarVuelta(){

    document.getElementById("fecha-vuelta").style.display="none";

    document.getElementById("fecha-ida").className="col-md-4";

}



function mostrarVuelta(){

    document.getElementById("fecha-vuelta").style.display="block";

    document.getElementById("fecha-ida").className="col-md-2";

}


</script>






<script src="../js/bootstrap.bundle.min.js"></script>



</body>

</html>
