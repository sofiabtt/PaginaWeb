<!DOCTYPE html>
<html lang="es">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HighFlight</title>
    <link rel="stylesheet" href="estilos.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous">

    <link rel="icon" type="logo04-sinFondo/png" href="/imagenes/logov1.png">

</head>

<body>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous">
    </script>

    <header class="barra-superior navbar navbar-expand-lg">
    <div class="container-fluid">

        <a class="navbar-brand" href="#">
            <img
                src="/imagenes/logov1.png"
                alt="Logo de la empresa"
                class="logo-barra"
            >
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menuPrincipal"
            aria-controls="menuPrincipal"
            aria-expanded="false"
            aria-label="Abrir menú"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div
            class="collapse navbar-collapse justify-content-end"
            id="menuPrincipal"
        >
            <ul class="navbar-nav align-items-lg-center gap-lg-3">

                <li class="nav-item">
                    <a class="nav-link" href="#">Inicio</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Nosotros</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Contacto</a>
                </li>

                <li class="nav-item">
                    <a class="btn btn-primary" href="#">
                        Registrarse
                    </a>
                </li>

            </ul>
        </div>

    </div>
    </header>
    <main class="d-flex justify-content-center align-items-center min-vh-100">

        <section class="login-contenedor">

            <h1 class="text-center mb-4 titulo-iniciosesion">
                Inicio de sesión
            </h1>

            <form>

                <div class="mb-4">
                    <label for="gmail" class="form-label texto-blanco">
                        Ingrese Gmail
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="gmail"
                        name="gmail"
                        placeholder="ejemplo@gmail.com"
                        required
                    >
                </div>

                <div class="d-flex justify-content-between align-items-end gap-3">

                    <div>
                        <p class="texto-registro mb-1 texto-blanco">
                            ¿No estás registrado?
                        </p>

                        <a href="registro.html" class="btn btn-outline-primary">
                            Registrarse
                        </a>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Continuar
                    </button>

                </div>

            </form>

        </section>

    </main>
    <!-- JavaScript de Bootstrap -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
