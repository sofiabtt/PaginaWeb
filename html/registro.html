<!DOCTYPE html>
<html lang="es">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    

    <link rel="stylesheet" href="../css/bootstrap.min.css">
    
    <link rel="stylesheet" href="../css/estilos.css">
    
    <link rel="icon" type="image/png" href="../imagenes/logo.png">

</head>

<body>


    <header class="barra-superior navbar navbar-expand-lg">

        <a class="navbar-brand">
            <img
                src="../imagenes/logo.png"
                alt="logo"
                width="60"
                height="60">
        </a>

        <div class="ms-auto d-none d-lg-flex align-items-center">

            <a class="nav-link">
                Novedades
            </a>

            <a class="nav-link">
                Destinos
            </a>

            <a class="nav-link">
                Ofertas
            </a>


        </div>

    </header>

    <main class="d-flex justify-content-center align-items-center">

        <section class="rectangulo-formulario">

            <h1 class="text-center mb-4 texto-negro">
                Crear Cuenta
            </h1>

            <form action="../php/validarRegistro.php" method="POST">

                <div class="mb-4">
    
                    <div class="d-flex align-items-center gap-3">
                        <label for="gmail" class="form-label texto-negro mb-0">
                            Ingrese mail:
                        </label>
                        <!--d-flex pone los elementos en la misma fila.-->
                        <div id="mensaje-error"></div>
                    </div>
                    <input
                        type="email"
                        class="form-control"
                        id="gmail"
                        name="gmail"
                        placeholder="nombreapellido@gmail.com"
                        required
                    >
                </div>

                <div class="d-flex justify-content-between align-items-end gap-3">
                <!--lo de arriba coloca dos sectores en una misma fila.-->
                    
                    <div>
                        <p class="texto-registro mb-1 texto-negro">
                            ¿Ya tienes cuenta?
                        </p>

                        <a href="iniciosesion.html" class="btn btn-outline-primary">
                            Inicio Sesión
                        </a>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Continuar
                    </button>

                </div>

            </form>
            

        </section>
        <a href="home.html" class="boton-atras">
            ← Atrás
        </a>

    </main>
    <!-- JavaScript de Bootstrap . permite que funcionen los componentes interactivos de Bootstrap,-->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    <script>
    //toma los parámetros que haya en la URL.
    const parametros = new URLSearchParams(window.location.search);
    //si el gmail existe, window.location.search vale:?error=usuario_existente
    if (parametros.get("error") === "usuario_existente") {
        document.getElementById("mensaje-error").innerHTML =
            '<div class="alerta-en-rojo">Este correo ya está registrado *</div>';
    }

    const gmail = parametros.get("gmail");

    if (gmail !== null) {
        document.getElementById("gmail").value = gmail;
    }
</script>
</body>
</html>
