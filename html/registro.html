<!DOCTYPE html>
<html lang="es">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous">
    
    <link rel="stylesheet" href="../css/estilos.css">
    
    <link rel="icon" type="image/png" href="../imagenes/logo.png">

</head>

<body>


    <header class="barra-superior navbar navbar-expand-lg">
    <div class="container-fluid">

        <!--PROXIMAMENTE AGREGAR A DONDE QUIERO QUE ME REDIRIJA-->
        <a class="navbar-brand" href="#">
            <img
                src="../imagenes/logo.png"
                alt="Logo de la empresa"
                class="logo-barra"
            >
        </a>
        <!--esto es para celulares, despues ver si sirve
        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menuPrincipal"
            aria-controls="menuPrincipal"
            aria-expanded="false"
            aria-label="Abrir menú"
        >
            <span class="navbar-toggler-icon"></span>
        </button>
        -->
        <div class="container-fluid">

        <div class="collapse navbar-collapse" id="menuPrincipal">

            <ul class="navbar-nav w-100 justify-content-evenly align-items-center">

        

                <li class="nav-item">
                    <a class="nav-link" href="#">Inicio</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Sobre Nosotros</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Contacto</a>
                </li>

                <li class="nav-item">
                    <a class="btn btn-primary" href="#">Registrarse</a>
                </li>

            </ul>

        </div>

    </div>
    </header>
    <main class="d-flex justify-content-center align-items-center">

        <section class="rectangulo-formulario">

            <h1 class="text-center mb-4 texto-negro">
                Crear Cuenta
            </h1>

            <form>
                <!--aún no está conectado con PHP-->

                <div class="mb-4">
                    <label for="gmail" class="form-label texto-negro">
                        Ingrese Gmail:
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="gmail"
                        name="gmail"
                        placeholder="nombreapellido@gmail.com"
                        required
                    >
                </div>

                <div class="d-flex justify-content-between align-items-end gap-3">
                <!--lo de arriba coloca dos sectores en una misma fila.-->
                    
                    <div>
                        <p class="texto-registro mb-1 texto-negro">
                            ¿Ya tienes cuenta?
                        </p>

                        <a href="iniciosesion.html" class="btn btn-outline-primary">
                            Atrás
                        </a>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Continuar
                    </button>

                </div>

            </form>

        </section>

    </main>
    <!-- JavaScript de Bootstrap . permite que funcionen los componentes interactivos de Bootstrap,-->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</html>
